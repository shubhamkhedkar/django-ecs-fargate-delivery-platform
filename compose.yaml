# Local, production-shaped demo: PostgreSQL + one-shot migrations + gunicorn web.
# Values below are local-only defaults; override them in a git-ignored .env file.
name: release-ledger

x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-me}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  DJANGO_SECURE_SSL_REDIRECT: "false"
  DJANGO_SECURE_COOKIES: "false"
  DJANGO_HSTS_SECONDS: "0"
  DEPLOY_ENVIRONMENT: local-compose
  DB_HOST: db
  DB_NAME: ledger
  DB_USER: ledger
  DB_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only}
  DB_SSLMODE: disable

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ledger -d ledger]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-local}
        GIT_SHA: ${GIT_SHA:-local}
    image: release-ledger:local
    <<: *hardening
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed_demo"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    image: release-ledger:local
    <<: *hardening
    environment: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
