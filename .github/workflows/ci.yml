# CI for pull requests and main: lint, tests, IaC checks and a local image build.
# Nothing is pushed or deployed from here; deployment is scripts/deploy.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: yamllint .
      - run: shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/stack
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -recursive -check ..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - name: Checkov
        run: pipx run checkov -d .. --framework terraform --quiet --compact

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Build (local only, not pushed)
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" -t release-ledger:ci .
      - name: Compose smoke test
        run: ./scripts/compose-smoke.sh
